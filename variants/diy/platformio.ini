; Meshtastic DIY v1 by Nano VHF Schematic based on ESP32-WROOM-32 (38 pins) devkit & EBYTE E22 SX1262/SX1268 module
[env:meshtastic-diy-v1]
extends = esp32_base
board = esp32doit-devkit-v1
board_check = true
build_flags =
  ${esp32_base.build_flags}
  -D DIY_V1
  -D EBYTE_E22
  -I variants/diy/v1

; Meshtastic DIY v1.1 new schematic based on ESP32-WROOM-32 & SX1262/SX1268 modules
[env:meshtastic-diy-v1_1]
extends = esp32_base
board = esp32doit-devkit-v1
board_level = extra
build_flags =
  ${esp32_base.build_flags}
  -D DIY_V1
  -D EBYTE_E22
  -I variants/diy/v1_1

; Port to Disaster Radio's ESP32-v3 Dev Board
[env:meshtastic-dr-dev]
extends = esp32_base
board = esp32doit-devkit-v1
board_upload.maximum_size = 4194304
board_upload.maximum_ram_size = 532480
build_flags =
  ${esp32_base.build_flags}
  -D DR_DEV
  -D EBYTE_E22
  -I variants/diy/dr-dev

; Hydra - Meshtastic DIY v1 hardware with some specific changes
[env:hydra]
extends = esp32_base
board = esp32doit-devkit-v1
build_flags =
  ${esp32_base.build_flags}
  -D DIY_V1
  -I variants/diy/hydra


; Promicro + E22(0)-xxxMM / RA-01SH modules board variant - DIY - without TCXO
[env:nrf52_promicro_diy_xtal]
extends = nrf52840_base
board = promicro-nrf52840
board_level = extra
build_flags = ${nrf52840_base.build_flags}
  -I variants/diy/nrf52_promicro_diy_xtal
  -D NRF52_PROMICRO_DIY
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/diy/nrf52_promicro_diy_xtal>
lib_deps = 
  ${nrf52840_base.lib_deps}
debug_tool = jlink


; Promicro + E22(0)-xxxM / HT-RA62 modules board variant - DIY - with TCXO
[env:nrf52_promicro_diy_tcxo]
extends = nrf52840_base
board = promicro-nrf52840
build_flags = ${nrf52840_base.build_flags}
  -I variants/diy/nrf52_promicro_diy_tcxo
  -D NRF52_PROMICRO_DIY
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/diy/nrf52_promicro_diy_tcxo>
lib_deps = 
  ${nrf52840_base.lib_deps}
debug_tool = jlink

; HermesX target for the fakeTec-style ProMicro nRF52840 carrier with an
; HT-RA62 TCXO LoRa module and a 2.42-inch SSD1309 I2C OLED.  The soldered
; controls use a rotary encoder on P0.20/P0.22/P1.00 and a buzzer on P0.24.
; WS2812 remains on P0.06 and GPS RX is remapped to P1.06.
[env:nrf52_promicro_diy_tcxo_hermesx]
extends = nrf52840_base
board = promicro-nrf52840
; nice!nano bootloader 0.9.2 accepts the application through 0xEA000.
; The HermesOne image starts at 0x26000, leaving 0xC4000 bytes.
board_upload.maximum_size = 802816
board_level = extra
build_flags = ${nrf52840_base.build_flags}
  -fmerge-all-constants
  -I variants/diy/nrf52_promicro_hermesx
  -D NRF52_PROMICRO_DIY
  -D HERMESX_NRF52840_PROMICRO=1
  -D HERMESONE_LOW_POWER_PROFILE=1
  -D HERMESONE_ROTARY_ONLY_INPUT=1
  -D DEBUG_MUTE
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_SX127X=1
  -D RADIOLIB_EXCLUDE_LR11X0=1
  -D MESHTASTIC_EXCLUDE_RANGETEST=1
  -D MESHTASTIC_EXCLUDE_NEIGHBORINFO=1
  -D MESHTASTIC_EXCLUDE_SERIAL=1
  -D MESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -D MESHTASTIC_EXCLUDE_ACCELEROMETER=1
  -D MESHTASTIC_EXCLUDE_MAGNETOMETER=1
  -D MESHTASTIC_EXCLUDE_POWER_TELEMETRY=1
  -D MESHTASTIC_EXCLUDE_POWERMON=1
  -D MESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
  -D MESHTASTIC_EXCLUDE_EXTERNALNOTIFICATION=1
  -D MESHTASTIC_EXCLUDE_MQTT=1
  -D MESHTASTIC_EXCLUDE_WAYPOINT=1
  -D MESHTASTIC_EXCLUDE_STOREFORWARD=1
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/diy/nrf52_promicro_diy_tcxo> -<modules/HermesEmUiModule.cpp>
lib_deps =
  ${nrf52840_base.lib_deps}
debug_tool = jlink

; Temporary field-diagnostic build for the ProMicro HermesX port.  It keeps
; the production feature set and pin map, but restores USB serial logging so
; early boot/assert failures can be identified on real hardware.
[env:nrf52_promicro_diy_tcxo_hermesx_diag]
extends = env:nrf52_promicro_diy_tcxo_hermesx
build_flags = ${env:nrf52_promicro_diy_tcxo_hermesx.build_flags}
  -D HERMESX_NRF52840_DIAGNOSTIC=1

; Seeed XIAO nRF52840 + XIAO Wio SX1262 DIY
[env:seeed-xiao-nrf52840-wio-sx1262]
board = xiao_ble_sense
extends = nrf52840_base
board_level = extra
build_flags = ${nrf52840_base.build_flags} -Ivariants/diy/seeed-xiao-nrf52840-wio-sx1262 -D PRIVATE_HW
  -Isrc/platform/nrf52/softdevice -Isrc/platform/nrf52/softdevice/nrf52
board_build.ldscript = src/platform/nrf52/nrf52840_s140_v7.ld
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/diy/seeed-xiao-nrf52840-wio-sx1262>
lib_deps =
  ${nrf52840_base.lib_deps}
debug_tool = jlink

; NanoVHF T-Energy-S3 + E22(0)-xxxM - DIY
[env:t-energy-s3_e22]
extends = esp32s3_base
board = esp32-s3-devkitc-1
board_build.partitions = default_16MB.csv
board_level = extra
board_upload.flash_size = 16MB ;Specify the FLASH capacity as 16MB
board_build.arduino.memory_type = qio_opi ;Enable internal PSRAM
build_unflags =
  ${esp32s3_base.build_unflags}
  -D ARDUINO_USB_MODE=1
build_flags =
  ${esp32s3_base.build_flags}
  -D EBYTE_ESP32_S3
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_MODE=0
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -I variants/diy/t-energy-s3_e22
